x-app-env: &app-env
  NODE_ENV: production
  SELF_HOSTED: 'true'
  ALLOW_REGISTRATION: 'false'
  ALLOW_INVITATION: 'true'
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Run demo:setup}@postgres:5432/openpanel
  DATABASE_URL_DIRECT: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/openpanel
  REDIS_URL: redis://redis:6379
  CLICKHOUSE_URL: http://openpanel:${GATEWAY_TOKEN:?Run demo:setup}@gateway:8080/openpanel
  COOKIE_SECRET: ${COOKIE_SECRET}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  API_URL: ${API_URL}
  DASHBOARD_URL: ${DASHBOARD_URL}
  CUSTOM_COOKIE_DOMAIN: ${CUSTOM_COOKIE_DOMAIN:-}
  BATCH_SIZE: '100'
  BATCH_INTERVAL: '1000'
  CONCURRENCY: '2'

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: openpanel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d openpanel']
      interval: 5s
      retries: 30
    mem_limit: 512m
  redis:
    image: redis:7.2.5-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction, --notify-keyspace-events, Ex]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 30
    mem_limit: 256m
  clickhouse:
    build:
      context: docker/clickhouse
      args:
        CLICKHOUSE_IMAGE: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:25.10.2.65}
    environment:
      CLICKHOUSE_USER: opadmin
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: openpanel
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
      GRAFANA_CH_PASSWORD: ${GRAFANA_CH_PASSWORD}
      OPENPANEL_CH_PASSWORD: ${OPENPANEL_CH_PASSWORD}
    volumes: [clickhouse-data:/var/lib/clickhouse]
    healthcheck:
      test: [CMD-SHELL, 'clickhouse-client --user opadmin --password "$$CLICKHOUSE_PASSWORD" --query "SELECT 1"']
      interval: 5s
      retries: 30
    mem_limit: 2g
    ulimits:
      nofile: {soft: 262144, hard: 262144}
  gateway:
    build: docker/gateway
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: openpanel_app
      CLICKHOUSE_PASSWORD: ${OPENPANEL_CH_PASSWORD}
      CLICKHOUSE_DATABASE: openpanel
      GATEWAY_TOKEN: ${GATEWAY_TOKEN}
    depends_on:
      clickhouse: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      retries: 30
    mem_limit: 192m
  api:
    build:
      context: .
      dockerfile: docker/openpanel-api/Dockerfile
    environment: *app-env
    command: [sh, -ec, 'CI=true pnpm -r run migrate:deploy && pnpm start']
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      gateway: {condition: service_healthy}
    ports: ['127.0.0.1::3000']
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:3000/healthcheck']
      interval: 5s
      start_period: 120s
      retries: 30
    mem_limit: 1g
  worker:
    image: lindesvard/openpanel-worker:2.3.0
    environment: *app-env
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:3000/healthcheck']
      interval: 5s
      start_period: 30s
      retries: 30
    mem_limit: 1g
  dashboard:
    build:
      context: .
      dockerfile: docker/openpanel-dashboard/Dockerfile
    environment:
      <<: *app-env
      API_URL_SSR: http://api:3000
    depends_on:
      api: {condition: service_healthy}
    ports: ['127.0.0.1::3000']
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:3000/api/healthcheck']
      interval: 5s
      start_period: 30s
      retries: 30
    mem_limit: 768m
  web:
    build: docker/web
    depends_on:
      dashboard: {condition: service_healthy}
    ports: ['127.0.0.1::8080']
    mem_limit: 128m
  grafana:
    build:
      context: .
      dockerfile: docker/grafana/Dockerfile
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GRAFANA_CH_PASSWORD: ${GRAFANA_CH_PASSWORD}
    ports: ['127.0.0.1::3000']
    volumes: [grafana-data:/var/lib/grafana]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'wget -qO- http://localhost:3000/api/health']
      interval: 5s
      retries: 30
    mem_limit: 512m
volumes:
  postgres-data:
  redis-data:
  clickhouse-data:
  grafana-data:
